config-version = 2

# Start AeroSpace at login
start-at-login = true

# Reload on save, so editing this file is the whole dev loop
auto-reload-config = true

# See: https://nikitabobko.github.io/AeroSpace/guide#normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
default-root-container-orientation = 'auto'

# Possible values: (qwerty|dvorak|colemak)
key-mapping.preset = 'qwerty'

# Hyprland feel: focus the window under the cursor, not just under the keys.
# This is the one behavior change that needs a few days to stop surprising you.
focus-follows-mouse.enabled = true

# Hyprland moves the mouse with focus. This does it per monitor, lazily, so
# switching monitors lands the cursor near the windows without a hard jump.
# Per-window cursor warping is commented out on purpose: it fights
# focus-follows-mouse and makes text selection fiddly.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# on-focus-changed = ['move-mouse window-lazy-center']

# Only config-version 2 can set this list explicitly.
# S is the scratchpad workspace driven by cmd-alt-s.
persistent-workspaces = [
    "1",
    "2",
    "3",
    "4",
    "5",
    "8",
    "9",
    "B",
    "F",
    "M",
    "N",
    "S",
    "T"
]

# Hyprland gaps_in=10 / gaps_out=20, with one deliberate exception.
# outer.top stays at 24 so windows clear the macOS menu bar instead of hiding
# behind it. AeroSpace does not reserve space for the menu bar on its own.
[gaps]
inner.horizontal = 10
inner.vertical =   10
outer.left =       20
outer.bottom =     20
outer.right =      20
outer.top =        24

[mode.main.binding]

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# --- Launchers ---
# Launcher keys are cmd-alt, not cmd, because macOS apps already claim
# cmd-t (new tab), cmd-d (bookmark), cmd-f (find), cmd-e (export), cmd-b.
cmd-alt-t = 'exec-and-forget open -a Ghostty'
cmd-alt-d = 'exec-and-forget open -a Raycast'
cmd-alt-e = 'exec-and-forget open -a Finder'
cmd-alt-b = 'exec-and-forget open -a Safari'
cmd-alt-w = 'exec-and-forget /Users/ryanbahadori/.config/aerospace/scripts/wallpaper-cycle.sh'

# --- Window state ---
# cmd-alt-f is float toggle. macOS owns cmd-f for find, so fullscreen lives on
# enter instead. Hyprland's $mod+F maps better to enter on a Mac than it does
# on Linux.
cmd-alt-f = 'layout floating tiling'
cmd-alt-enter = 'fullscreen'
cmd-alt-shift-enter = 'macos-native-fullscreen'

# --- Focus ---
# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# --- Move ---
# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- Swap ---
# Hyprland $mod SHIFT + arrow with the swap flag. Focus stays on the same
# screen slot, which is what makes it feel like rearranging rather than moving.
cmd-alt-shift-h = 'swap left'
cmd-alt-shift-j = 'swap down'
cmd-alt-shift-k = 'swap up'
cmd-alt-shift-l = 'swap right'

# --- Monitors ---
# Only one monitor is attached (S27R35x), so these do nothing until you dock.
# Cheaper than rediscovering them later.
cmd-alt-shift-left  = 'focus-monitor left'
cmd-alt-shift-right = 'focus-monitor right'
cmd-alt-shift-down  = 'focus-monitor down'
cmd-alt-shift-up    = 'focus-monitor up'

# --- Scratchpad ---
# summon-workspace pulls S onto whichever monitor has focus. Same shape as
# Hyprland's togglespecialworkspace.
cmd-alt-s = 'summon-workspace S'

# --- Resize ---
# Hyprland resizeactive steps by pixels, usually 10. The 50 steps stay for
# coarse moves, 10 for fine ones.
# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus  = 'resize smart -50'
alt-shift-equal  = 'resize smart +50'
alt-shift-comma  = 'resize smart -10'
alt-shift-period = 'resize smart +10'

# --- Workspaces ---
# --auto-back-and-forth mirrors Hyprland's workspace_auto_back_and_forth.
# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = 'workspace --auto-back-and-forth 1'
alt-2 = 'workspace --auto-back-and-forth 2'
alt-3 = 'workspace --auto-back-and-forth 3'
alt-4 = 'workspace --auto-back-and-forth 4'
alt-5 = 'workspace --auto-back-and-forth 5'
alt-8 = 'workspace --auto-back-and-forth 8'
alt-9 = 'workspace --auto-back-and-forth 9'
alt-b = 'workspace --auto-back-and-forth B' # browser
alt-f = 'workspace --auto-back-and-forth F' # finder
alt-m = 'workspace --auto-back-and-forth M'
alt-n = 'workspace --auto-back-and-forth N' # notes
alt-t = 'workspace --auto-back-and-forth T' # terminal

# Move window to a workspace and stay put, like Hyprland's movetoworkspace
# without followfocus.
# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-b = 'move-node-to-workspace B'
alt-shift-f = 'move-node-to-workspace F'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-n = 'move-node-to-workspace N'
alt-shift-t = 'move-node-to-workspace T'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = 'workspace-back-and-forth'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'
alt-shift-r = 'mode resize'

# 'resize' binding mode
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.resize.binding]
# h/l = shrink/grow width, j/k = grow/shrink height
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
comma = 'resize smart -10'
period = 'resize smart +10'
b = 'balance-sizes'

enter = 'mode main'
esc = 'mode main'

# 'service' binding mode
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Float rules. The `if = 'test ...'` form replaces the soft-deprecated
# if.app-id / if.app-name-regex-substring keys.
# Ordering matters: the first matching callback wins unless
# check-further-callbacks is set.
# See: https://nikitabobko.github.io/AeroSpace/guide#on-window-detected-callback

[[on-window-detected]]
if = 'test %{app-name} = Shottr'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.QuickTimePlayerX'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.DiskUtility'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.ColorSyncUtility'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.PhotoBooth'
run = 'layout floating'

# Helium floats as a whole app. A title match on just the picture-in-picture
# popup would be tighter, so that the main browser tiles with everything else.
# I could not confirm the popup window's title, so this stays broad until you
# check it with:
#   aerospace list-windows --monitor all --app-bundle-id net.imput.helium
[[on-window-detected]]
if = 'test %{app-name} = Helium'
run = 'layout floating'